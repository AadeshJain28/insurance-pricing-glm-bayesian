name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Only the dependencies the test suite imports — the heavy modelling
      # libraries (torch/pymc/prophet/catboost) are not needed to run tests.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e . --no-deps

      # Advisory: style issues should not fail the build.
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check src tests

      - name: Test
        run: pytest --cov=insurance_pricing
